<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Generator</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <main class="app">
    <label for="resume-input" class="sr-only">Texto do currículo</label>
    <textarea
      id="resume-input"
      class="resume-input"
      placeholder="Cole aqui o currículo gerado pela IA... (ou arraste um arquivo .txt)"
      autofocus
    ></textarea>

    <div class="actions">
      <button id="generate-btn" class="generate-btn" type="button">Gerar PDF</button>
      <span class="hint">Ctrl+Enter para gerar</span>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/js/app.js"></script>
</body>
</html>
